experiment: exp11
seed: 42
runs_per_setting: 10
num_nodes: 100
topology_type: er
edge_prob: 0.08
use_topology_cache: true
message_source: 0
base_delay: 1.0
jitter: 0.2
fanout: 3
num_clusters: 4

# For the paper, keep AHBN vs Q-AHBN as the main comparison.
# Gossip and cluster are retained as reference baselines.
strategies:
  - gossip
  - cluster
  - ahbn
  - qahbn

churn_rates:
  - 0.00
  - 0.05
  - 0.10
  - 0.20
  - 0.30

failure:
  enabled: false

churn:
  enabled: true
  start_time: 2.0
  interval: 1.5
  num_cycles: 4
  down_time: 2.0
  target_fraction: 0.10
  min_targets: 1
  allow_cluster_heads: true
  permanent_leave: false

ahbn:
  adaptive_fanout: true
  hybrid_mode: true
  use_tau_gate: true
  default_fanout: 3
  min_cluster_targets: 1

  # Exp11 uses smoother control because churn is repeated, not a single shock.
  ewma_alpha: 0.20

  d0: 0.25
  u0: 6.0
  l0: 2.5
  rho0: 0.12
  deg0: 8.0
  ov0: 0.25
  r0: 0.40

  a_dup: -2.6
  a_load: -1.2
  a_lat: 1.2
  a_churn: 1.1
  a_deg: -0.3
  a_ov: -1.4
  a_red: -2.2

  b_degree: 0.20
  b_overlap: 0.80

  min_fanout: 2
  max_fanout: 5
  mode_threshold: 0.58

  fanout_dup_penalty: 2.8
  fanout_load_penalty: 0.8
  fanout_lat_reward: 0.45
  fanout_red_penalty: 2.4

  tau_max: 0.82
  tau_min: 0.30
  tau_dup_penalty: 1.4
  tau_red_penalty: 2.0

  min_weight: 0.35
  max_weight: 0.68

  # Exp11 controller additions.
  weight_center_pull: 0.65
  churn_weight_cap: 0.05
  mode_hysteresis: 0.08
  tau_churn_boost: 0.80
  fanout_churn_boost: 0.80

  # Exp11 strategy shaping: keep both cluster and gossip paths alive during churn.
  mode_sensitive_mix: true
  cluster_mode_bias: 0.80
  gossip_mode_bias: 0.75
  preserve_cluster_path_under_tau: true
  cluster_reserve_in_gossip_mode: 1
  gossip_reserve_in_cluster_mode: 1

q_learning:
  alpha: 0.25
  gamma: 0.90
  epsilon: 0.30
  epsilon_min: 0.03
  epsilon_decay: 0.995

  # Churn reward: delivery/stability first, overhead second.
  w_delivery_proxy: 6.00
  w_dup: 0.60
  w_latency: 0.40
  w_load: 0.25
  w_redundancy: 0.40
  w_churn: 0.20
  w_capacity: 0.20

  # Encourage recovery behavior when churn or latency is high.
  w_recovery_bonus: 3.00
  high_churn_threshold: 0.12
  high_latency_threshold: 1.20
  latency_ref: 2.5
  load_ref: 6.0
